<style>.adm-splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#faf6ef;font-family:system-ui,sans-serif;color:#4a2f20;text-align:center;padding:24px;box-sizing:border-box}.adm-splash img{width:min(62vw,260px);height:auto;max-height:34vh;object-fit:contain;animation:admPop 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(59,36,20,.25))}.adm-spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(74,47,32,.15);border-top-color:#b08a2e;animation:admSpin 1s linear infinite}.adm-splash p{margin:0;font-weight:600;letter-spacing:.14em;font-size:13px;text-transform:uppercase;opacity:.75}@keyframes admSpin{to{transform:rotate(360deg)}}@keyframes admPop{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}</style></head>
<body data-base="{{BASE}}" data-site="{{SITE_URL}}">
<div id="admwrap"><div id="app"><div class="adm-splash"><img src="{{LOGO}}" alt="Classix Home Needs" width="240" height="140"><div class="adm-spin"></div><p>Classix Home Needs · Admin</p></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div>

<script src="{{BASE}}/admin.js"></script>
